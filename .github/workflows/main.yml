name: Build Wildbook Installers
on:
  push:
    branches:
      - devops-build
  pull_request:
  
permissions:
  issues: write
  pull-requests: write
  contents: write

jobs:
  build:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 360 # Set the timeout to 6 hours
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'
          
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Ensure setuptools is installed
        run: |
          python3 -m ensurepip
          python3 -m pip install setuptools

      - name: Install dependencies in Windows
        shell: powershell
        if: ${{ matrix.os == 'windows-latest' }}
        run: |
            $env:NODE_GYP_FORCE_PYTHON = (Get-Command python | Select-Object -ExpandProperty Path)
            npm install --no-audit

      - name: Install dependencies in Mac
        shell: bash
        if: ${{ matrix.os == 'macos-latest' }}
        run: |
            NODE_GYP_FORCE_PYTHON=$(which python3) npm install --save-dev appdmg --no-audit
            npm install --no-audit

                
      - name: Build the application
        run: npm run make
        
      - name: List win output directory
        shell: cmd
        if: ${{ matrix.os == 'windows-latest' }}
        run: dir out\make\squirrel.windows\x64

  
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.os }}-installer
          path: |
            out\make\squirrel.windows\x64\*.exe
            out/make/*.dmg

