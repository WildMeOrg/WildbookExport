name: Build Wildbook Installers
on:
  push:
    branches:
      - devops-build
  pull_request:
  
permissions:
  issues: write
  pull-requests: write
  contents: write

jobs:
  build:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 360 # Set the timeout to 6 hours
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'
          
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Ensure setuptools is installed
        run: |
          python3 -m ensurepip
          python3 -m pip install setuptools

      - name: Install dependencies in Windows
        shell: powershell
        if: ${{ matrix.os == 'windows-latest' }}
        run: |
            $env:NODE_GYP_FORCE_PYTHON = (Get-Command python | Select-Object -ExpandProperty Path)
            npm audit fix
            npm update
            npm install

      - name: Install dependencies in Mac
        shell: bash
        if: ${{ matrix.os == 'mac-latest' }}
        run: |
            NODE_GYP_FORCE_PYTHON=$(which python3) npm install --save-dev appdmg
            npm audit fix
            npm update
            npm install

                
      - name: Build the application
        run: npm run make

      - name: Upload artifacts
        uses: actions/upload-artifact@v3
        with:
          name: ${{ matrix.os }}-installer
          path: |
            out/make/*.exe
            out/make/*.dmg

